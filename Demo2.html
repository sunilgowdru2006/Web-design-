<!DOCTYPE html>
<html>
<head>
    <title>Lists Demonstration</title>
</head>
<body>

<h2>Types of Lists</h2>

<h3>1. Unordered List</h3>
<ul>
    <li>BCA</li>
    <li>BCom</li>
    <li>BSC</li>
    <li>BBA</li>
</ul>

<h3>2. Ordered List</h3>
<ol>
    <li>BCA</li>
    <li>BCom</li>
    <li>BSC</li>
    <li>BBA</li>
</ol>

<h3>3. Description List</h3>
<dl>
    <dt>BCA</dt>
    <dd>Bachelor of Computer Application</dd>

    <dt>BBA</dt>
    <dd>Business Administration Management</dd>
</dl>

</body>
</html>
