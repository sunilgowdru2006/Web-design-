
<!DOCTYPE html>
<head>
    <title>Nested List</title>
</head>
<body>

<h2>Nested List</h2>

<ol>
    <li>Land Transport
        <ul>
            <li>Bus</li>
            <li>Car</li>
        </ul>
    </li>

    <li>Water Transport
        <ul>
            <li>Ship</li>
            <li>Boat</li>
        </ul>
    </li>

    <li>Air Transport
        <ul>
            <li>Aeroplane</li>
            <li>Helicopter</li>
        </ul>
    </li>
</ol>

</body>
</html>
